apis:
  - aid: azure-event-grid:publisher-api
    name: Azure Event Grid Publisher API
    description: >-
      Data-plane REST API for publishing events and CloudEvents to Event Grid
      topics and domains, and for managing namespace topics, subscriptions,
      and event delivery. Authentication uses Microsoft Entra ID OAuth 2.0
      bearer tokens or shared-access keys via the aeg-sas-key header.
    humanURL: https://learn.microsoft.com/en-us/rest/api/eventgrid/
    baseURL: https://{topic-endpoint}.{region}.eventgrid.azure.net
    tags:
      - Event Grid
