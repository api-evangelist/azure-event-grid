aid: azure-event-grid
name: Azure Event Grid
description: >-
  Azure Event Grid is a fully managed event routing service from Microsoft
  Azure that enables event-driven, reactive programming by ingesting events
  from Azure services, SaaS providers, and custom sources and delivering them
  to subscribers such as Azure Functions, Logic Apps, webhooks, and event
  hubs. It supports both Event Grid topics and the MQTT/CloudEvents-based
  Event Grid namespaces for IoT and pub-sub workloads. The Event Grid REST
  APIs and Azure SDKs use Microsoft Entra ID OAuth 2.0 bearer tokens or
  shared-access keys for authentication.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
